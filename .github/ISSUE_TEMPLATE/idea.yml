name: Idea
description: Suggest something EcoLoco could do.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would it help with
      description: Who is it for (students, teachers, schools), and what can't they do today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Data source
      description: Optional. If it needs new plant or map data, where would it come from?
