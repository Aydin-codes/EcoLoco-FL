name: Bug report
description: Something in the app or website doesn't work.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to see it
      placeholder: |
        1. Open EcoScan
        2. Add a plant and press Scan all
        3. ...
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options: [ecoloco.app on a phone, ecoloco.app on a computer, Expo Go on iPhone, Expo Go on Android, Running it locally]
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: Optional. Please crop out anything personal, like your address.
